name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both OSes, because moomux shells out to tmux and git and is used mostly
  # from macOS: Linux-only CI missed that tmux reports a pane's cwd with
  # symlinks resolved, so every macOS worktree under a symlinked path looked
  # like a cwd mismatch (see samePath in internal/app/app.go).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew list tmux >/dev/null 2>&1 || brew install tmux

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -race -shuffle=on -count=1

      # -race here too: the e2e tests are the only ones driving the real
      # tmux/git binaries, which is where concurrent access actually happens.
      - name: End-to-end tests
        run: go test -tags e2e ./e2e/... -race -shuffle=on -v -count=1

  # The `test` job runs go.mod's `toolchain` (the newest Go); this one runs
  # its `go` line, the oldest Go a `go install` user may have. With
  # GOTOOLCHAIN=local, setup-go reads the `go` line instead of `toolchain`,
  # and go won't switch up to a newer toolchain on its own.
  min-go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Build
        run: go version && go build ./...

      - name: Vet
        run: go vet ./... && go vet -tags e2e ./e2e/...

      - name: Unit tests
        run: go test ./... -shuffle=on -count=1

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # go.mod's `toolchain` line, the same Go that test and release.yml
      # build with, so govulncheck reports the stdlib that actually ships.
      # One pin: a separate one here once drifted from what release.yml used.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd — run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi

      # staticcheck v0.8.1 can't read go1.27.2's export data ("export data
      # version 5 is greater than maximum supported version 4"), so this one
      # step runs on go1.27.1. Only this step: 1.27.2 is a security release,
      # and govulncheck below must see the patched toolchain. Drop the pin
      # once a staticcheck release supports 1.27.2.
      - name: staticcheck
        env:
          GOTOOLCHAIN: go1.27.1
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      # Default (symbol-level) mode: flags only vulnerabilities the code
      # actually reaches, so an unreachable one in a required module doesn't
      # block every merge until an upstream release lands.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # The version-bump logic that tags and ships every merge to main had a
      # test that nothing ever ran.
      - name: Release version rules
        run: ./scripts/next_version_test.sh

      # Supply-chain cooldown: no module or tool pin newer than 72h. The
      # same rule dependabot follows, enforced for hand-made bumps too.
      - name: Dependency age
        run: |
          ./scripts/check_dep_age_test.sh
          ./scripts/check_dep_age.sh
